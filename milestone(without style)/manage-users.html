<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Users - Hotel Billing System</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="./js/manage-users-index.js"></script>
  </head>
  <body>
    <div id="header-div">
      <h1 id="header-text">MANAGE USERS</h1>
      <a href="dashboard.html">Back to Dashboard</a>
    </div>
    <div id="table-div"></div>

    <div id="edit-div" style="display:none;">
      <h3>Update User</h3>
      <p id="edit-username-label"></p>
      <select id="update-role"></select>
      <select id="update-status">
        <option value="Active">Active</option>
        <option value="Inactive">Inactive</option>
      </select>
      <input type="hidden" id="update-user-id" />
      <button type="button" id="btn-update">UPDATE</button>
      <button type="button" id="btn-cancel-update">Cancel</button>
    </div>

    <div id="footer-div"></div>
  </body>
</html>
