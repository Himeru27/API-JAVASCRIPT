<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Room Types - Hotel Billing System</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="./js/room-type-index.js"></script>
  </head>
  <body>
    <div id="header-div">
      <h1 id="header-text">ROOM TYPES</h1>
      <a href="dashboard.html">Back to Dashboard</a>
    </div>
    <div id="main-div">
      <input
        type="text"
        id="type-name"
        placeholder="Room Type Name (e.g. Deluxe)"
      />
      <input
        type="text"
        id="description"
        placeholder="Description"
      />
      <input
        type="number"
        id="rate"
        placeholder="Room Rate"
      />
      <button type="button" id="btn-submit">Add Room Type</button>
    </div>
    <div id="table-div"></div>

    <div id="edit-div" style="display:none;">
      <h3>Update Room Type</h3>
      <input type="text" id="update-type-name" placeholder="Room Type Name" />
      <input type="text" id="update-description" placeholder="Description" />
      <input type="number" id="update-rate" placeholder="Room Rate" />
      <input type="hidden" id="update-room-type-id" />
      <button type="button" id="btn-update">UPDATE</button>
      <button type="button" id="btn-cancel-update">Cancel</button>
    </div>

    <div id="footer-div"></div>
  </body>
</html>
