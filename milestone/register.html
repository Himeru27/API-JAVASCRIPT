<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Hotel Billing System</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="./js/register-index.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container mt-5">
      <div id="header-div"><h1 id="header-text">HOTEL BILLING SYSTEM</h1></div>
      <div id="main-div" class="mt-4" style="max-width:400px;">
        <div class="row mt-2">
          <div class="col-md-12">
            <input
              type="text"
              class="form-control"
              id="username"
              placeholder="Username"
            />
          </div>
        </div>

        <div class="row mt-2">
          <div class="col-md-12">
            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="Password"
            />
          </div>
        </div>

        <div class="row mt-2">
          <div class="col-md-12">
            <button type="button" class="btn btn-primary w-100" id="btn-submit">
              Register</button
            ><br />
          </div>
        </div>

        <div class="row mt-2">
          <div class="col-md-12">
            <a href="login.html">Already have an account? Login here.</a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
