<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Modules</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="./js/index.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="container mt-5">
      <div id="header-div"><h1 id="header-text">STUDENTS DATABASE</h1></div>
      <div id="main-div">
        <div class="row mt-2">
          <div class="col-md-6">
            <input
              type="text"
              class="form-control"
              id="school-id"
              placeholder="School ID"
            />
          </div>
          <div class="col-md-6">
            <input
              type="text"
              class="form-control"
              id="last-name"
              placeholder="Last Name"
            />
          </div>
        </div>

        <div class="row mt-2">
          <div class="col-md-6">
            <input
              class="form-control"
              type="text"
              id="first-name"
              placeholder="First Name"
            />
          </div>
          <div class="col-md-6">
            <select class="form-select" id="course"></select>
          </div>
        </div>

        <div class="row mt-2">
          <div class="col-md-6">
            <input
              type="date"
              class="form-control"
              id="birth-date"
              placeholder="Birthday"
            />
          </div>
          <div class="col-md-6">
            <input
              type="text"
              class="form-control"
              id="address"
              placeholder="Address"
            />
            <br />
          </div>
        </div>

        <div class="row mt-2">
          <div class="col-md-6">
            <input
              type="number"
              class="form-control"
              id="balance"
              placeholder="Balance"
            />
          </div>
          <div class="col-md-6">
            <button type="button" class="btn btn-primary w-100" id="btn-submit">
              Submit</button
            ><br />
          </div>
        </div>
      </div>
      <div id="table-div"></div>
      <div id="footer-div"></div>
    </div>

  <!-- BLANK MODAL -->
  <div class="modal fade" id="blank-modal" role="modal">
    <div class="modal-dialog modal-md">
      <div class="modal-content">
        <div class="modal-header text-white" style="background-color:#006400">
          <h5 class="modal-title" id="blank-modal-title">Modal Title</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="blank-modal-body">
          <div class="row" id="blank-main-div" style="padding:5px;"></div>
        </div>
        <div class="modal-footer" id="blank-modal-footer">
            <button type="button" class="btn btn-secondary btn-sm w-100" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  </body>
</html>
