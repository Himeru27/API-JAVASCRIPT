<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Information Management System</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="./js/index.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="container mt-3">
      <div id="page-title-div"><h1 id="header-text">BOOK INFORMATION MANAGEMENT SYSTEM</h1></div>
      <div id="main-div" class="mt-5">
        <div class="row">
          <div class="col-lg-6">
            <input
              type="text"
              class="form-control"
              id="title"
              placeholder="Book Title"
            />
          </div>
          <div class="col-lg-6">
            <input
              type="text"
              class="form-control"
              id="author"
              placeholder="Author"
            />
          </div>
        </div>

        <div class="row mt-3">
          <div class="col-lg-6">
            <input
              class="form-control"
              type="text"
              id="isbn"
              placeholder="ISBN"
            />
          </div>
          <div class="col-lg-6">
            <select class="form-select" id="category"></select>
          </div>
        </div>

        <div class="row mt-3">
          <div class="col-lg-6">
            <input
              type="number"
              class="form-control"
              id="year-published"
              placeholder="Year Published"
            />
          </div>
          <div class="col-lg-6">
            <input
              type="text"
              class="form-control"
              id="publisher"
              placeholder="Publisher"
            />
          </div>
        </div>

        <div class="mt-3 text-end">
          <button type="button" class="btn btn-sm btn-primary" id="btn-submit">Submit</button>
        </div>
      </div>
      <div id="table-div" class="mt-1"></div>

      <div id="borrow-page-title-div" class="mt-5"><h1 id="borrow-header-text">BORROW TRANSACTION</h1></div>
      <div id="borrow-header-div" class="mt-3">
        <div class="row">
          <div class="col-lg-6">
            <select class="form-select" id="students-select" title="Select Students"></select>
          </div>
          <div class="col-lg-6">
            <input type="date" id="borrow-date" class="form-control"  value="" />
          </div>
        </div>
      </div>
      <div class="mt-3 text-end">
        <button type="button" class="btn btn-sm btn-primary" id="button-details">+</button>
      </div>
      <div id="details-div" class="mt-1">
        <table class="table table-striped">
          <thead>
            <tr>
              <th class="text-white bg-success">Book</th>
              <th class="text-white bg-success">Qty</th>
            </tr>
          </thead>
          <tbody id="details-body"></tbody>
        </table>
      </div>
      <div class="row">
        <div class="col-lg-12 text-end">
          <button type="button" id="button-save" class="btn btn-primary">SAVE</button>
        </div>
      </div>

      <div id="footer-div"></div>
    </div>

  <!-- BLANK MODAL -->
  <div class="modal fade" id="blank-modal" role="modal">
    <div class="modal-dialog modal-md">
      <div class="modal-content">
        <div class="modal-header text-white" style="background-color:#006400">
          <h5 class="modal-title" id="blank-modal-title">Modal Title</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="blank-modal-body">
          <div class="row" id="blank-main-div" style="padding:5px;"></div>
        </div>
        <div class="modal-footer" id="blank-modal-footer">
            <button type="button" class="btn btn-secondary btn-sm w-100" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  </body>
</html>
