<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rooms - Hotel Billing System</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="./js/rooms-index.js"></script>
  </head>
  <body>
    <div id="header-div">
      <h1 id="header-text">ROOMS</h1>
      <a href="dashboard.html">Back to Dashboard</a>
    </div>
    <div id="main-div">
      <input
        type="text"
        id="room-number"
        placeholder="Room Number (e.g. 101)"
      />
      <select id="room-type"></select>
      <button type="button" id="btn-submit">Add Room</button>
    </div>
    <div id="table-div"></div>

    <div id="edit-div" style="display:none;">
      <h3>Update Room</h3>
      <input type="text" id="update-room-number" placeholder="Room Number" />
      <select id="update-room-type"></select>
      <input type="hidden" id="update-room-id" />
      <button type="button" id="btn-update">UPDATE</button>
      <button type="button" id="btn-cancel-update">Cancel</button>
    </div>

    <div id="footer-div"></div>
  </body>
</html>
