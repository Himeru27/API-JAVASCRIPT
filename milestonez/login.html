<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Hotel Billing System</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="./js/login-index.js"></script>
  </head>
  <body>
    <div id="header-div">
      <h1 id="header-text">HOTEL BILLING SYSTEM</h1>
    </div>
    <div id="main-div">
      <input
        type="text"
        id="username"
        placeholder="Username"
      />
      <br />
      <input
        type="password"
        id="password"
        placeholder="Password"
      />
      <br />
      <button type="button" id="btn-submit">Login</button>
      <br />
      <a href="register.html">Don't have an account? Register here.</a>
    </div>
  </body>
</html>
